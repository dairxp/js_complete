<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Book</title>
  </head>
  <body class="bg-zinc-900 text-white">

    <div class="flex justify-center items-center h-screen">
      <h1 class="text-2xl">Tareas</h1>

    <form id="taskForm" class="bg-zinc-700 p-10 rounded-md max-w-md">
      
      <label for="title" class="block">Titulo</label>
      <input type="text" name= "title" placeholder="Escribe tu titulo" class="bg-gray-800 px-1 py-2">
      
      
      <label for="descripcion" class="block">Descripcion</label>
      <textarea name="descripcion" rows="3" placeholder="Write a description" class="bg-gray-800 px-1 py-2 w-full"></textarea>

      <button >
        Guardar
      </button>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
